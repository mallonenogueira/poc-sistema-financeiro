name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, testes (JUnit/Mockito/WireMock) e cobertura
        run: mvn -B -ntp verify
      - name: Publica relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            **/target/surefire-reports
            **/target/site/jacoco
      - name: Guarda o jar da Lambda
        uses: actions/upload-artifact@v4
        with:
          name: lambda-jar
          path: lambda/statement-report-lambda/target/statement-report-lambda.jar

  frontend:
    name: Frontend (lint + testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  iac:
    name: IaC (Terraform + Kustomize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt/validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Renderiza overlays do Kubernetes
        run: |
          kubectl kustomize k8s/overlays/dev > /dev/null
          kubectl kustomize k8s/overlays/prod > /dev/null

  images:
    name: Imagens Docker
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: account-service, context: ., dockerfile: docker/java-service.Dockerfile, module: services/account-service }
          - { name: statement-service, context: ., dockerfile: docker/java-service.Dockerfile, module: services/statement-service }
          - { name: api-gateway, context: ., dockerfile: docker/java-service.Dockerfile, module: services/api-gateway }
          - { name: frontend, context: frontend, dockerfile: frontend/Dockerfile, module: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-dev:
    name: Deploy dev (EKS + Lambda)
    needs: [images, iac]
    runs-on: ubuntu-latest
    environment: dev   # regras de proteção/aprovação ficam no GitHub Environment
    permissions:
      contents: read
      id-token: write  # OIDC: sem access keys de longa duração no repositório
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Atualiza tags das imagens
        working-directory: k8s/overlays/dev
        run: |
          for svc in account-service statement-service api-gateway frontend; do
            kustomize edit set image "$svc=${REGISTRY}/$svc:${GITHUB_SHA}"
          done
      - name: Aplica no cluster
        run: |
          aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}"
          kubectl apply -k k8s/overlays/dev
          kubectl -n pocbank rollout status deployment --timeout=5m
      - uses: actions/download-artifact@v4
        with:
          name: lambda-jar
      - name: Publica nova versão da Lambda
        run: |
          aws lambda update-function-code --function-name pocbank-statement-report-dev \
            --zip-file fileb://statement-report-lambda.jar --publish
