# Requer o External Secrets Operator. A credencial do banco vive no AWS Secrets Manager
# e é sincronizada como Secret do Kubernetes — nada sensível versionado no Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: account-db
  namespace: pocbank
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: account-db
  dataFrom:
    - extract:
        key: pocbank/account-db
