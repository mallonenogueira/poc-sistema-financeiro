apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# Em dev a senha vem de um gerador local; em prod use External Secrets (AWS Secrets Manager).
secretGenerator:
  - name: account-db
    namespace: pocbank
    literals:
      - username=pocbank
      - password=pocbank

patches:
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: HorizontalPodAutoscaler, name: account-service }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
