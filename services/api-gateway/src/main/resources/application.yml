server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/api/**]':
            allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
            allowed-methods: GET,POST,OPTIONS
            allowed-headers: "*"
            exposed-headers: X-Correlation-Id,Location
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin X-Correlation-Id, RETAIN_FIRST
      routes:
        - id: accounts
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/accounts/**,/api/transfers/**
          filters:
            # Retry só em GET: POST de transferência não é repetido pelo gateway
            # (a idempotência fica a cargo do cliente via Idempotency-Key).
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
        - id: statements
          uri: ${STATEMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/statements/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
