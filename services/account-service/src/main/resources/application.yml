server:
  port: ${PORT:8081}
  shutdown: graceful
  # Respeita X-Forwarded-* do gateway: o header Location aponta para a URL pública, não para o pod.
  forward-headers-strategy: framework

spring:
  application:
    name: account-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/accounts}
    username: ${DB_USERNAME:pocbank}
    password: ${DB_PASSWORD:pocbank}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  mvc:
    problemdetails:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          fraud-api:
            connect-timeout: 1000
            read-timeout: 2000
            logger-level: basic

app:
  kafka:
    topics:
      transfer-events: transfer-events
  outbox:
    relay-interval-ms: 500

integrations:
  fraud-api:
    url: ${FRAUD_API_URL:http://localhost:8089}

resilience4j:
  circuitbreaker:
    instances:
      fraud-api:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      fraud-api:
        timeout-duration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
