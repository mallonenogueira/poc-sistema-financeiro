# Ambiente local completo: `docker compose up --build`
# Front: http://localhost:3000 | Gateway: http://localhost:8080 | Kafka UI: http://localhost:8090
name: pocbank

x-java-env: &java-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75

services:
  # ------------------------------------------------------------ dados / mensageria
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: pocbank
      POSTGRES_PASSWORD: pocbank
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocbank -d accounts"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  # ------------------------------------------------------------ AWS local + dependências externas
  localstack:
    image: localstack/localstack:3.8
    ports: ["4566:4566"]
    environment:
      SERVICES: s3,lambda,iam
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - ./infra/localstack/deploy-lambda.sh:/opt/pocbank/deploy-lambda.sh:ro
      - ./lambda/statement-report-lambda/target:/opt/pocbank/lambda:ro
      # A Lambda roda num container irmão (runtime java21), por isso o socket do Docker.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls s3://pocbank-statements"]
      interval: 5s
      retries: 20

  fraud-api:
    image: wiremock/wiremock:3.9.1
    ports: ["8089:8080"]
    volumes:
      - ./infra/wiremock:/home/wiremock:ro

  # ------------------------------------------------------------ aplicações
  account-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args: { MODULE: services/account-service }
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/accounts
      FRAUD_API_URL: http://fraud-api:8080
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      fraud-api: { condition: service_started }

  statement-service:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args: { MODULE: services/statement-service }
    environment:
      <<: *java-env
      MONGODB_URI: mongodb://mongo:27017/statements
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports: ["8082:8082"]
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
      localstack: { condition: service_healthy }

  api-gateway:
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args: { MODULE: services/api-gateway }
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8081
      STATEMENT_SERVICE_URL: http://statement-service:8082
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports: ["8080:8080"]
    depends_on: [account-service, statement-service]

  frontend:
    build: ./frontend
    ports: ["3000:8080"]
    depends_on: [api-gateway]
